name: Build QY native ARM64
on:
  workflow_dispatch:
jobs:
  build:
    # Provision a trusted ARM64 runner with Docker/Buildx, git and Python first.
    runs-on: [self-hosted, Linux, ARM64, qy-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable app and infrastructure bundle
        run: bash deploy/jetson/qy-test/build.sh
      - name: Package installer and configuration
        run: bash deploy/jetson/qy-test/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qy-arm64-release
          path: |
            deploy/jetson/qy-test/out/qy-arm64-images.tar.gz
            deploy/jetson/qy-test/out/qy-jetson-config.tar.gz
            deploy/jetson/qy-test/out/SHA256SUMS
          retention-days: 7
