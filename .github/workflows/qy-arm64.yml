name: Build QY native ARM64
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Optional same-source native image artifact run ID (operations-script fixes only)
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: qy-native-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CUSTOM_IMAGE: visiontestai/frappe:qy-arm64-native1
      BUILDX_BUILDER: default
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 and reclaim unused hosted toolchains
        run: |
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker info
          df -h /
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id != ''
        with:
          pattern: qy-arm64-release-*
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Validate same-source native image reuse
        if: inputs.reuse_run_id != ''
        run: |
          cd deploy/jetson/qy-test
          previous=$(cat out/local-repo.commit)
          git fetch --depth=1 origin "$previous"
          git diff --exit-code "$previous" HEAD -- ../../../services/hospital Dockerfile healthcheck.py provision.sh prepare_recipe.py patch_portal.py verify_sources.py versions.env sources.lock.json
          python3 verify_archive.py out/qy-arm64-images.tar.gz > out/archive-verification.json
          tar -xzf out/qy-jetson-config.tar.gz -C out docker-debs
          docker load -i out/qy-arm64-images.tar.gz
          docker run --rm -i --entrypoint ./env/bin/python "$CUSTOM_IMAGE" < verify_image.py > out/image-verification.json
          cp out/local-repo.commit out/image-source.commit
      - name: Build immutable app and infrastructure bundle
        if: inputs.reuse_run_id == ''
        run: bash deploy/jetson/qy-test/build.sh 2>&1 | tee build-native.log
      - name: Prepare Ubuntu 22.04 ARM64 offline Docker packages
        if: inputs.reuse_run_id == ''
        run: bash deploy/jetson/qy-test/prepare_offline.sh
      - name: Test Docker packages without network on Ubuntu 22.04 ARM64
        run: |
          docker pull --platform linux/arm64 ubuntu:22.04
          docker run --rm --network none --platform linux/arm64 -e DEBIAN_FRONTEND=noninteractive -v "$PWD/deploy/jetson/qy-test/out/docker-debs:/deps:ro" ubuntu:22.04 bash -euc '
            cd /deps
            sha256sum -c SHA256SUMS
            apt-get --no-download --no-install-recommends -y install /deps/*.deb
            docker --version
            docker compose version
          '
      - name: Package installer and configuration
        run: bash deploy/jetson/qy-test/package.sh
      - name: Test fresh installation, jobs, PDF, restart and persistence
        run: bash deploy/jetson/qy-test/ci_acceptance.sh
      - name: Render VisionCare in native ARM64 browser
        run: |
          python3 -m venv /tmp/qy-browser
          /tmp/qy-browser/bin/pip install playwright==1.56.0
          /tmp/qy-browser/bin/playwright install --with-deps chromium
          cd deploy/jetson/qy-test
          set -a
          source .env
          set +a
          /tmp/qy-browser/bin/python browser_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qy-arm64-release-${{ github.run_number }}
          compression-level: 0
          path: |
            deploy/jetson/qy-test/out/qy-arm64-images.tar.gz
            deploy/jetson/qy-test/out/qy-jetson-config.tar.gz
            deploy/jetson/qy-test/out/SHA256SUMS
            deploy/jetson/qy-test/out/*verification.json
            deploy/jetson/qy-test/out/*metadata.json
            deploy/jetson/qy-test/out/acceptance*.json
            deploy/jetson/qy-test/out/visioncare-native-arm64.png
            deploy/jetson/qy-test/out/*verification.txt
            deploy/jetson/qy-test/out/*.lock
            deploy/jetson/qy-test/out/source-lock.json
            deploy/jetson/qy-test/out/all-images-inspect.json
            deploy/jetson/qy-test/out/versions.txt
            deploy/jetson/qy-test/out/local-repo.commit
            deploy/jetson/qy-test/out/image-source.commit
            build-native.log
          retention-days: 7
