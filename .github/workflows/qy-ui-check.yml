name: Diagnose QY UI on native ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted toolchains
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/download-artifact@v4
        with:
          pattern: qy-arm64-release-*
          run-id: 44518988873
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Start native base with read-only candidate app for diagnosis
        run: |
          test "$(uname -m)" = aarch64
          cd deploy/jetson/qy-test
          bash out/qy-jetson-install.run --extract-only out
          rm out/qy-jetson-install.run
          export QY_PACKAGE="$GITHUB_WORKSPACE/services/hospital/qy-vision-hospital/qy_vision_hospital"
          python3 - <<'PYOVERRIDE'
          import os, json
          services={name:{"volumes":[os.environ['QY_PACKAGE']+':/home/frappe/frappe-bench/apps/qy_vision_hospital/qy_vision_hospital:ro']} for name in ('configurator','provision','backend','frontend','worker','scheduler','websocket')}
          open('out/ui-override.yml','w').write(json.dumps({'services':services}))
          PYOVERRIDE
          export COMPOSE_FILE="$PWD/compose.yml:$PWD/out/ui-override.yml"
          export QY_SITE=qy-ci.lan QY_BASE_URL=http://127.0.0.1:18080 STATION_ID=qy-ci-01
          sudo -E bash install.sh
          sudo chown "$(id -u):$(id -g)" .env
      - name: Render and collect browser diagnostics
        run: |
          python3 -m venv /tmp/qy-browser
          /tmp/qy-browser/bin/pip install playwright==1.56.0
          /tmp/qy-browser/bin/playwright install --with-deps chromium
          cd deploy/jetson/qy-test
          set -a
          source .env
          set +a
          /tmp/qy-browser/bin/python browser_acceptance.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          cd deploy/jetson/qy-test
          sudo docker compose ps -a
          sudo docker compose logs --tail=50 provision backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qy-ui-diagnostics
          path: |
            deploy/jetson/qy-test/out/acceptance-browser.json
            deploy/jetson/qy-test/out/visioncare-native-arm64.png
          retention-days: 3
