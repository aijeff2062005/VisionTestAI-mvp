# Auto happy-path on Jetson chart (mock STT/readiness, no Face).
# Does NOT replace clinic.yaml — start with:
#   FACE_MODE=off FACE_VECTORDB_ENABLED=0 \
#   AC_CONFIG=.../clinic_happy_path.yaml REPLACE_AC=1 \
#   ./start_station.sh --demo-session
station_id: station-01

mqtt:
  host: 192.168.1.78
  port: 1883
  username: "vision"
  password: ""
  keepalive: 60

hospital:
  base_url: http://192.168.1.78:8000
  timeout_seconds: 10.0
  api_key: ""
  api_secret: ""

media:
  enabled: false
  base_url: http://192.168.1.78:9010
  token: ""
  timeout_seconds: 30.0

cccd_qr:
  enabled: false
  after_face: false

face_vectordb:
  enabled: false
  mode: "off"
  base_url: http://192.168.1.78:8100
  sync_on_startup: false
  sync_before_identify: false
  sync_today_appointments_only: false
  overnight_wipe_enabled: false

face_devices: []

http:
  timeout_seconds: 10.0

display:
  host: 0.0.0.0
  port: 8088

protocol:
  distance_m: 5.0
  letters_per_row: 5
  adaptive_row_testing: false
  snellen_stop_on_fail: true
  max_misses: 2
  letter_uncertain_threshold: 0.45
  letter_accept_threshold: 0.75
  letter_timeout_seconds: 5
  same_size_retries: 0
  staircase: true
  start_logmar: 0.69897
  logmar_step: 0.1
  row_logmars:
    - 1.0       # 1/10
    - 0.69897   # 2/10
    - 0.52288   # 3/10
    - 0.39794   # 4/10
    - 0.30103   # 5/10
    - 0.22185   # 6/10
    - 0.15490   # 7/10
    - 0.09691   # 8/10
    - 0.04576   # 9/10
    - 0.0       # 10/10
  max_rows_per_eye: 16
  readiness_timeout_seconds: 30.0
  demo_mode: true
  allow_step_skip: true

paths:
  dmn: dmn/acuity_flow.dmn
  scenarios: scenarios/vi/manifest.yaml
  journals: data/journals

bridges:
  readiness: mock
  stt: mock
  face:
    mode: "off"
    host: 192.168.1.18
    port: 80
    password: ""
    device_id: panel-01
    role: combined
    poll_interval_seconds: 0.2
    timeout_seconds: 30.0
    accept_recent_seconds: 15.0
    live_events_url: http://127.0.0.1:7790/events
  smarteyes_root: ../smarteyes
  smarteyes_config: ../smarteyes/configs/clinic_jetson.yaml
  smarteyes_source: "C270"
  smarteyes_show_window: false
  smarteyes_strict: false
  sloan_root: ../sloan_stt
  min_confidence_demo: 0.55
  min_confidence_confirm: 0.55
  sloan_min_margin: 0.05
