[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visiontestai-ac"
version = "0.1.0"
description = "VisionTestAI Assistant Controller — MQTT/HTTP exam orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyYAML>=6.0.1",
  "httpx>=0.27.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "jsonschema>=4.22.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
]

[project.scripts]
visiontestai-ac = "ac.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
