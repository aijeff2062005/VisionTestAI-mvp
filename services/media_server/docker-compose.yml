# Optional S3 backend (Garage single-node). Media gateway can use local disk without this.
services:
  garage:
    image: dxflrs/garage:v2.0.0
    container_name: visiontestai-garage
    ports:
      - "3900:3900"   # S3 API
      - "3902:3902"   # S3 web
      - "3903:3903"   # admin
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "GK1234567890abcdef"
      GARAGE_DEFAULT_SECRET_KEY: ""
      GARAGE_DEFAULT_BUCKET: "visiontestai-media"
    restart: unless-stopped

volumes:
  garage-meta:
  garage-data:
